# Salesforce Code Analyzer v5 configuration for ashish-rk.
# Only generated, third-party or non-Salesforce tooling code is ignored. Every app source file is scanned.
ignores:
  files:
    # Build output of the React UI bundles (generated by Vite from src/; the deployable artifact)
    - "**/uiBundles/*/dist/**"
    - "**/uiBundles/*/build/**"
    # Node/Playwright tooling of the React UI bundles (build scripts, configs, e2e). LWC platform rules
    # don't apply to Node code; each bundle's own `npm run lint` + `tsc -b` checks these files.
    - "**/uiBundles/*/scripts/**"
    - "**/uiBundles/*/e2e/**"
    - "**/uiBundles/*/*.config.js"
    - "**/uiBundles/*/*.config.ts"
    # TypeScript declaration files: type-only (no runtime code), checked by `tsc`. `declare var` is the
    # only way to type a property on globalThis, which core `no-var` wrongly flags.
    - "**/*.d.ts"
    # Dependencies, caches and generated typings
    - "**/node_modules/**"
    - "**/.sfdx/**"
    - "**/.sf/**"
    - "**/.localdevserver/**"
    - "**/coverage/**"
    - "**/.next/**"
    - "**/.angular/**"

rules:
  eslint:
    # The React UI bundles are TypeScript: component props are type-checked by tsc,
    # so runtime PropTypes would only duplicate the types.
    "react/prop-types":
      disabled: true
