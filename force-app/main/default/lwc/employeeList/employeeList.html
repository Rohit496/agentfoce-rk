<template>
  <lightning-card title="Employee List" icon-name="custom:custom63">
    <div class="slds-var-p-horizontal_medium slds-var-m-top_medium">
      <lightning-input
        type="search"
        label="Search by Name"
        value={searchKey}
        onchange={handleSearch}
        placeholder="Enter name to search..."
      ></lightning-input>
    </div>

    <template lwc:if="{filteredEmployees.length > 0}">
      <div class="card-body">
        <div class="slds-var-p-around_x-small">
          <template for:each={visibleEmployees} for:item="emp">
            <div key={emp.id} data-id="employee-card" class="list-card slds-box slds-media slds-media_center slds-var-m-bottom_small">
              <div class="slds-media__body">
                <h2 class="slds-text-heading_small slds-hyphenate slds-var-m-bottom_xx-small">{`${emp.firstName} ${emp.lastName}`}</h2>
                <p class="slds-grid slds-grid_vertical-align-center slds-text-body_small slds-text-color_weak slds-hyphenate slds-var-m-vertical_xxx-small">
                  <lightning-icon icon-name="utility:email" size="xx-small" class="slds-var-m-right_xx-small"></lightning-icon>
                  {emp.email}
                </p>
                <p class="slds-grid slds-grid_vertical-align-center slds-text-body_small slds-text-color_weak slds-hyphenate slds-var-m-vertical_xxx-small">
                  <lightning-icon icon-name="utility:call" size="xx-small" class="slds-var-m-right_xx-small"></lightning-icon>
                  {emp.phone}
                </p>
                <p class="slds-grid slds-grid_vertical-align-center slds-text-body_small slds-text-color_weak slds-hyphenate slds-var-m-vertical_xxx-small">
                  <lightning-icon icon-name="utility:identity" size="xx-small" class="slds-var-m-right_xx-small"></lightning-icon>
                  {emp.gender}
                </p>
              </div>
              <div class="slds-media__figure slds-media__figure_reverse">
                <lightning-button-icon
                  icon-name="utility:chevronright"
                  variant="brand"
                  size="medium"
                  data-emp-id={emp.id}
                  onclick={handleSelectEmployee}
                  alternative-text="View"
                ></lightning-button-icon>
              </div>
            </div>
          </template>
        </div>

        <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-border_top slds-var-p-around_small">
          <lightning-button
            label="Previous"
            onclick={handlePrev}
            disabled="{currentPage <= 1}"
            variant="neutral"
          ></lightning-button>

          <div data-id="page-text" class="slds-text-body_small slds-text-color_weak slds-var-p-horizontal_small">Page {currentPage} of {totalPages}</div>

          <lightning-button
            label="Next"
            onclick={handleNext}
            disabled="{currentPage >= totalPages}"
            variant="neutral"
          ></lightning-button>
        </div>
      </div>
    </template>

    <template lwc:else>
      <div data-id="empty-state" class="slds-var-p-around_medium slds-text-color_weak slds-align_absolute-center">
        No employee data available.
      </div>
    </template>
  </lightning-card>
</template>
