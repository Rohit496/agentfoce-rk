<template>
    <lightning-card title="Account Insights (Next.js)" icon-name="standard:account">
        <div class="slds-var-p-horizontal_small">
            <template lwc:if={errorMessage}>
                <div
                    class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-var-m-bottom_small"
                    role="alert"
                >
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="utility:error"
                            alternative-text="Error"
                            size="x-small"
                            variant="inverse"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>{errorMessage}</p>
                    </div>
                </div>
            </template>
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Loading embedded Next.js app"
                    size="small"
                ></lightning-spinner>
            </template>
            <lightning-ui-embedding
                lwc:ref="embedding"
                src={computedSrc}
                title="Account Insights (Next.js)"
                sandbox="allow-popups"
                props={account}
                onratingchange={handleRatingChange}
            ></lightning-ui-embedding>
        </div>
    </lightning-card>
</template>
