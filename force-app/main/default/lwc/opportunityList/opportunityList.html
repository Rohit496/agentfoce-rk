<template>
    <lightning-card title="Opportunity List" icon-name="standard:opportunity">
        <div class="slds-var-p-horizontal_medium slds-var-m-top_medium">
            <lightning-input
                type="search"
                label="Search by Name or Account"
                value={searchKey}
                onchange={handleSearch}
                placeholder="Enter opportunity or account name..."
            ></lightning-input>
        </div>

        <template lwc:if="{filteredOpportunities.length > 0}">
            <div class="card-body">
                <div class="slds-var-p-around_x-small">
                    <template
                        for:each={visibleOpportunities}
                        for:item="opp"
                    >
                        <div key={opp.id} data-id="opportunity-card" class="list-card slds-box slds-media slds-media_center slds-var-m-bottom_small">
                            <div class="slds-media__body">
                                <h2 class="slds-text-heading_small slds-hyphenate slds-var-m-bottom_xx-small">{opp.name}</h2>
                                <p class="slds-grid slds-grid_vertical-align-center slds-text-body_small slds-hyphenate slds-var-m-vertical_xxx-small">
                                    <lightning-icon
                                        icon-name="standard:account"
                                        size="xx-small"
                                        class="slds-var-m-right_xx-small"
                                    ></lightning-icon>
                                    {opp.accountName}
                                </p>
                                <p class="slds-grid slds-grid_vertical-align-center slds-text-body_small slds-hyphenate slds-var-m-vertical_xxx-small detail-emphasis" data-id="amount">
                                    <lightning-icon
                                        icon-name="utility:money"
                                        size="xx-small"
                                        class="slds-var-m-right_xx-small"
                                    ></lightning-icon>
                                    {opp.formattedAmount}
                                </p>
                                <p class="slds-grid slds-grid_vertical-align-center slds-text-body_small slds-hyphenate slds-var-m-vertical_xxx-small slds-text-color_weak" data-id="close-date">
                                    <lightning-icon
                                        icon-name="utility:event"
                                        size="xx-small"
                                        class="slds-var-m-right_xx-small"
                                    ></lightning-icon>
                                    {opp.formattedCloseDate}
                                </p>
                            </div>
                            <div class="slds-media__figure slds-media__figure_reverse">
                                <lightning-button-icon
                                    icon-name="utility:chevronright"
                                    variant="brand"
                                    size="medium"
                                    data-opp-id={opp.id}
                                    onclick={handleSelectOpportunity}
                                    alternative-text="View"
                                ></lightning-button-icon>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-border_top slds-var-p-around_small">
                    <lightning-button
                        label="Previous"
                        onclick={handlePrev}
                        disabled="{currentPage <= 1}"
                        variant="neutral"
                    ></lightning-button>

                    <div data-id="page-text" class="slds-text-body_small slds-text-color_weak slds-var-p-horizontal_small">
                        Page {currentPage} of {totalPages}
                    </div>

                    <lightning-button
                        label="Next"
                        onclick={handleNext}
                        disabled="{currentPage >= totalPages}"
                        variant="neutral"
                    ></lightning-button>
                </div>
            </div>
        </template>

        <template lwc:else>
            <div
                data-id="empty-state"
                class="slds-var-p-around_medium slds-text-color_weak slds-align_absolute-center"
            >
                No opportunity data available.
            </div>
        </template>
    </lightning-card>
</template>
