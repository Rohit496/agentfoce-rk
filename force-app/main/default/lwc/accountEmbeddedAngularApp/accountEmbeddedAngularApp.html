<template>
    <lightning-card title="Account Insights (Angular)" icon-name="standard:account">
        <div class="slds-var-p-horizontal_small">
            <template lwc:if={error}>
                <div class="slds-media error-banner" role="alert">
                    <lightning-icon
                        class="slds-media__figure"
                        icon-name="utility:error"
                        alternative-text="Error"
                        size="x-small"
                        variant="inverse"
                    ></lightning-icon>
                    <div class="slds-media__body">
                        <p class="error-title">{error.title}</p>
                        <p>{error.message}</p>
                    </div>
                </div>
            </template>
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Loading embedded Angular app"
                    size="small"
                ></lightning-spinner>
            </template>
            <lightning-ui-embedding
                lwc:ref="embedding"
                class={embeddingClass}
                src={computedSrc}
                title="Account Insights (Angular)"
                sandbox="allow-popups"
                props={account}
                onratingchange={handleRatingChange}
            ></lightning-ui-embedding>
        </div>
    </lightning-card>
</template>
