<template>
    <lightning-card
        title="Third-party Web Component (GA)"
        icon-name="utility:favorite"
    >
        <div class="slds-var-p-horizontal_medium">
            <p class="slds-text-color_weak slds-var-m-bottom_medium">
                <code>&lt;w27-rating-stars&gt;</code> is a plain custom element
                loaded from a static resource and rendered natively
                with&nbsp;<code>lwc:external</code>. No iframe, no rewrite.
            </p>

            <template lwc:if={libraryLoaded}>
                <!-- Star colour by rating: 1-2 red, 3 yellow, 4-5 green. -->
                <w27-rating-stars
                    lwc:external
                    class="{rating >= 4 ? 'rating_high' : rating === 3 ? 'rating_medium' : 'rating_low'}"
                    value={rating}
                    max={max}
                    label="Product rating"
                    lwc:spread={starProps}
                    onrate={handleRate}
                ></w27-rating-stars>

                <p
                    class="slds-text-heading_small slds-var-m-top_small"
                    aria-live="polite"
                >
                    LWC state: rating = <strong>{rating}</strong> / {max}
                    {rating >= 4 ? ' 🔥' : ''}
                </p>

                <div
                    class="slds-text-body_small slds-var-m-top_x-small"
                    aria-live="polite"
                    data-id="save-status"
                >
                    <template lwc:if={isSaving}>
                        <span class="slds-text-color_weak">Saving rating…</span>
                    </template>
                    <template lwc:elseif={saveError}>
                        <span class="slds-text-color_error" role="alert"
                            >Not saved: {saveError}</span
                        >
                    </template>
                    <template lwc:else>
                        <span class="slds-text-color_weak"
                            >Click a star to save a rating.</span
                        >
                    </template>
                </div>
            </template>
            <template lwc:elseif={errorMessage}>
                <div class="slds-text-color_error" role="alert">
                    {errorMessage}
                </div>
            </template>
            <template lwc:else>
                <div class="slds-is-relative slds-var-p-vertical_large">
                    <lightning-spinner
                        alternative-text="Loading rating library"
                        size="small"
                    ></lightning-spinner>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
